# Builds and tests the helper binaries on every change. A helpers-v* tag also
# publishes them as a release with build provenance tied to this workflow run.
name: helpers

on:
  pull_request:
  push:
    branches: [main]
    tags: ['helpers-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # release upload (tags only)
      id-token: write       # build provenance (tags only)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm gcc g++ libyuv-dev libjpeg-turbo8-dev opencl-c-headers

      - name: Fetch pinned Wine runner and DXVK
        run: python3 scripts/creality.py fetch --dir "$RUNNER_TEMP/runtime" | tee "$RUNNER_TEMP/paths.txt"

      - name: Configure
        run: |
          python3 scripts/creality.py --config config.ci.local.json configure \
            --runner "$(sed -n 's/^runner: //p' "$RUNNER_TEMP/paths.txt")" \
            --dxvk-dir "$(sed -n 's/^dxvk: //p' "$RUNNER_TEMP/paths.txt")" \
            --installer "$RUNNER_TEMP/not-needed-for-build.exe" \
            --data-dir "$RUNNER_TEMP/data"

      - name: Build portable helpers
        run: python3 scripts/creality.py --config config.ci.local.json build --portable

      - name: Check portable linking
        run: |
          for f in build/*.so build/v4l2-helper build/sdk-frame-helper; do
            echo "$f: $(readelf -d "$f" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | tr '\n' ' ')"
          done
          ! readelf -d build/sdk-frame-helper | grep -E 'libyuv|libjpeg'

      - name: Tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/check_public.py --worktree
          git diff --check

      - name: Package with license notices
        run: |
          # sdk-frame-helper statically contains libyuv and libjpeg-turbo; the
          # Windows DLLs contain Wine's LGPL interface-ID tables (see THIRD_PARTY_NOTICES.md).
          mkdir build/licenses
          cp LICENSE build/licenses/crealityscan-linux-compat-LICENSE
          cp NOTICE.md THIRD_PARTY_NOTICES.md build/licenses/
          cp -L /usr/share/doc/libyuv-dev/copyright build/licenses/libyuv-copyright
          cp -L /usr/share/doc/libjpeg-turbo8-dev/copyright build/licenses/libjpeg-turbo-copyright
          cp -L /usr/share/common-licenses/LGPL-2.1 build/licenses/wine-LGPL-2.1
          ref="${GITHUB_REF_NAME#helpers-}"; name="crealityscan-helpers-${ref//\//-}.tar.gz"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C build -cf - \
            manifest.json $(python3 -c 'import json; print(" ".join(json.load(open("build/manifest.json"))))') \
            $(cd build && ls licenses/*) | gzip -n > "$name"
          sha256sum "$name" | tee "$name.sha256"
          echo "PACKAGE=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helpers
          path: crealityscan-helpers-*

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/helpers-v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.PACKAGE }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/helpers-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Prebuilt helper programs for this project: the USB camera bridge DLLs, OpenCL fixes and diagnostics.

          **You don't need to download anything here.** To install CrealityScan on Linux, follow the [Install steps in the README](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}#install). Setup downloads this archive and checks its SHA-256 automatically once the release is pinned in \`config/versions.lock.json\`.

          The "Source code" archives below are a snapshot of the commit these helpers were built from. Install from the main branch instead.

          - Built by this repository's \`helpers\` workflow on Ubuntu 24.04 from ${GITHUB_SHA}.
          - Verify the build provenance: \`gh attestation verify $PACKAGE --repo ${GITHUB_REPOSITORY}\`
          - Licenses for the bundled components are in the archive's \`licenses/\` folder; see THIRD_PARTY_NOTICES.md.
          EOF
          gh release create "$GITHUB_REF_NAME" "$PACKAGE" "$PACKAGE.sha256" \
            --title "Prebuilt helpers $GITHUB_REF_NAME" --notes-file notes.md
